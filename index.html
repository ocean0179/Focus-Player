<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Focus Player</title>

  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>

<body>
  <main class="app">
    <header class="app-header">
      <div class="app-actions" aria-label="앱 메뉴">
        <button
          type="button"
          class="app-action-button"
          id="statsBtn"
          aria-label="통계 열기"
          aria-controls="statsPanel"
          aria-expanded="false"
          title="통계"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19V10M10 19V5M16 19v-7M22 19H2" />
          </svg>
        </button>

        <button
          type="button"
          class="app-action-button"
          id="settingsBtn"
          aria-label="설정 열기"
          aria-controls="settingsPanel"
          aria-expanded="false"
          title="설정"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M10 14v6" />
          </svg>
        </button>
      </div>
    </header>

    <section class="focus-section">
      <p class="session-mode" id="sessionMode">FOCUS</p>

      <h1 class="timer" id="timer">50:00</h1>

      <p id="sessionMessage"></p>

      <div class="session-info">
        <span id="sessionCount">Session 1</span>
        <span class="separator">·</span>
        <span id="todayFocusTime">Today 00:00</span>
      </div>

      <div class="timer-controls">
        <button type="button" id="startBtn">시작</button>
        <button type="button" id="pauseBtn">일시정지</button>
        <button
          type="button"
          id="endBtn"
          aria-label="현재 세션 건너뛰기"
          title="현재 세션 건너뛰기"
        >종료</button>
      </div>
    </section>

    <section
      class="utility-panel"
      id="statsPanel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="statsPanelTitle"
      hidden
    >
      <div class="utility-panel-content stats-panel">
        <div class="utility-panel-header">
          <h2 id="statsPanelTitle">최근 7일 기록</h2>
          <button
            type="button"
            class="utility-panel-close"
            id="closeStatsBtn"
            aria-label="통계 닫기"
          >×</button>
        </div>

        <div id="weeklyChart" class="weekly-chart"></div>

        <div id="statsList"></div>
      </div>
    </section>

    <section class="music-section" aria-label="음악 플레이어">
      <div class="music-toolbar">
        <div class="playlist-actions">
          <div class="main-playlist-selector" id="mainPlaylistSelector">
            <button
              type="button"
              class="main-playlist-toggle"
              id="mainPlaylistToggle"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="mainPlaylistDropdown"
            >
              <span id="currentPlaylistName">플레이리스트 선택</span>
              <span class="main-playlist-arrow" aria-hidden="true">▾</span>
            </button>

            <div
              class="main-playlist-dropdown"
              id="mainPlaylistDropdown"
              role="listbox"
              aria-label="플레이리스트 선택"
              hidden
            ></div>
          </div>

        <button
          type="button"
          id="managePlaylistsBtn"
          aria-controls="playlistManagerPanel"
          aria-expanded="false"
        >
          플레이리스트 관리
        </button>
        </div>

        <div class="volume-control">
          <label for="volumeSlider">볼륨</label>

          <input
            type="range"
            id="volumeSlider"
            min="0"
            max="100"
            step="1"
          />

          <span id="volumeValue">50</span>
        </div>
      </div>

      <div class="player-container">
        <div id="youtubePlayer">YouTube Player</div>

        <div class="player-empty-state" aria-hidden="true">
          <span class="player-empty-icon">♪</span>
          <strong>음악이 아직 없습니다</strong>
          <span>플레이리스트를 만들어 집중할 음악을 추가해보세요.</span>
        </div>
      </div>

      <div class="music-footer">
        <div class="music-info">
          <span class="music-info-label">현재 재생</span>
          <p id="trackTitle">재생 중인 음악 없음</p>
        </div>

        <div class="player-controls">
          <button type="button" id="prevBtn">이전</button>
          <button type="button" id="playPauseBtn">재생</button>
          <button type="button" id="nextBtn">다음</button>
        </div>
      </div>
    </section>

    <section
      class="utility-panel"
      id="playlistManagerPanel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="playlistManagerTitle"
      hidden
    >
      <div class="utility-panel-content playlist-manager-panel">
        <div class="utility-panel-header playlist-manager-header">
          <h2 id="playlistManagerTitle">플레이리스트 관리</h2>
          <button
            type="button"
            class="utility-panel-close"
            id="closePlaylistManagerBtn"
            aria-label="플레이리스트 관리 닫기"
          >×</button>
        </div>

        <p
          class="playlist-manager-message"
          id="playlistManagerMessage"
          role="status"
          aria-live="polite"
        ></p>

        <div class="playlist-manager-layout">
        <div class="playlist-manager-sidebar">
          <h3>플레이리스트</h3>
          <div
            class="managed-playlist-list"
            id="managedPlaylistList"
          ></div>

          <form id="createPlaylistForm">
            <label for="newPlaylistName">새 플레이리스트</label>
            <div class="playlist-manager-input-row">
              <input
                type="text"
                id="newPlaylistName"
                placeholder="플레이리스트 이름"
                maxlength="60"
              />
              <button type="submit">생성</button>
            </div>
          </form>
        </div>

        <div class="playlist-manager-detail">
          <div class="managed-playlist-detail-header">
            <h3 id="managedPlaylistName">플레이리스트 선택</h3>
            <button
              type="button"
              id="deleteManagedPlaylistBtn"
              hidden
            >
              플레이리스트 삭제
            </button>
          </div>

          <form id="renamePlaylistForm" hidden>
            <label for="renamePlaylistInput">
              플레이리스트 이름 변경
            </label>
            <div class="playlist-manager-input-row">
              <input
                type="text"
                id="renamePlaylistInput"
                maxlength="60"
              />
              <button type="submit">이름 저장</button>
            </div>
          </form>

          <ul
            class="managed-track-list"
            id="managedTrackList"
          ></ul>

          <form id="addTrackForm" hidden>
            <h4>곡 추가</h4>

            <label for="trackUrlInput">YouTube URL</label>
            <input
              type="url"
              id="trackUrlInput"
              placeholder="https://www.youtube.com/watch?v=..."
            />

            <label for="trackTitleInput">곡 제목</label>
            <input
              type="text"
              id="trackTitleInput"
              placeholder="곡 제목"
              maxlength="120"
            />

            <button type="submit">곡 추가</button>
          </form>
        </div>
        </div>
      </div>
    </section>

    <section
      class="utility-panel"
      id="settingsPanel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsPanelTitle"
      hidden
    >
      <div class="utility-panel-content settings-panel">
        <div class="utility-panel-header">
          <h2 id="settingsPanelTitle">설정</h2>
          <button
            type="button"
            class="utility-panel-close"
            id="closeSettingsBtn"
            aria-label="설정 닫기"
          >×</button>
        </div>

        <div class="setting-row">
          <label for="focusDurationInput">집중 시간</label>
          <input
            type="number"
            id="focusDurationInput"
            min="1"
            max="180"
          />
          <span>분</span>
        </div>

        <div class="setting-row">
          <label for="breakDurationInput">휴식 시간</label>
          <input
            type="number"
            id="breakDurationInput"
            min="1"
            max="60"
          />
          <span>분</span>
        </div>

        <div class="setting-row">
          <label>
            <input type="checkbox" id="autoStartBreakInput" />
            휴식 자동 시작
          </label>
        </div>

        <div class="setting-row">
          <label>
            <input type="checkbox" id="autoStartFocusInput" />
            집중 자동 시작
          </label>
        </div>

        <div class="settings-actions">
          <button type="button" id="saveSettingsBtn">저장</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
